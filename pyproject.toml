[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroformatting"
version = "0.1.5"
description = "Commit-point streaming validation and semantic grounding for LLM outputs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["neuroformatting*"]
